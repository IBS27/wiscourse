<head>

<title>wiscourse landing page concepts</title>
<link rel="icon" href="favicon.svg" />
<link rel="preconnect" href="https://rsms.me/" />
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<script>
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q || localStorage.getItem("wc-landing.theme");
    if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
      document.documentElement.classList.add("dark");
  })();
</script>
<style>
/* ---------- shared tokens (copied from src/index.css) ---------- */
:root {
  --radius: 8px;
  --page: #ececee; --surface: #ffffff; --sunken: #f4f4f5; --raised: #ffffff; --hover: #f4f4f5;
  --line: #e5e5e8; --line-2: #d6d6db; --chip: #f4f4f5;
  --ink: #18181b; --ink-2: #55555f; --ink-3: #8a8a93;
  --red: #c5050c; --red-bg: #fdf1f1;
  --today-bg: #18181b; --today-fg: #ffffff;
  --shadow: 0 8px 24px rgba(16, 17, 20, 0.12);
  --menu-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.1), 0 1px 3px rgba(0, 0, 0, 0.06);
  --course-indigo: #4f46e5; --course-amber: #b45309; --course-teal: #0f766e; --course-sky: #0369a1;
  --course-rose: #be123c; --course-emerald: #047857; --course-violet: #6d28d9; --course-orange: #c2410c;
  --course-none: #71717a;
  --brand: var(--red); --brand-ink: #101114;
  color-scheme: light;
}
.dark {
  --page: #0b0b0b; --surface: #181818; --sunken: #0f0f0f; --raised: #1e1e1e; --hover: #242424;
  --line: #2b2b2b; --line-2: #3c3c3c; --chip: #242424;
  --ink: #e8e8e8; --ink-2: #a3a3a3; --ink-3: #737373;
  --red: #ff4b54; --red-bg: #2b1417;
  --today-bg: #e8e8e8; --today-fg: #181818;
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
  --menu-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
  --course-indigo: #818cf8; --course-amber: #f0a13a; --course-teal: #2dd4bf; --course-sky: #4cb4ec;
  --course-rose: #fb7185; --course-emerald: #34d399; --course-violet: #a78bfa; --course-orange: #fb923c;
  --course-none: #8c8c8c;
  --brand-ink: #e8e8e8;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--surface); color: var(--ink);
  font-family: "Inter", ui-sans-serif, system-ui, sans-serif; font-feature-settings: "cv11", "ss01";
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
@supports (font-variation-settings: normal) { body { font-family: "InterVariable", "Inter", ui-sans-serif, system-ui, sans-serif; } }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
img, svg { display: block; }
.tabular { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }

/* ---------- logo lockup ---------- */
.wc-logo { display: inline-flex; align-items: baseline; gap: 0.34em; line-height: 1; color: var(--ink); }
.wc-logo .wc-mark { height: 0.72em; width: 1.119em; }
.wc-logo .wc-word { height: 0.7734em; width: 4.6487em; transform: translateY(0.0112em); }

/* ---------- switcher chrome (not part of any design) ---------- */
#wc-switch {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 1000;
  display: flex; align-items: center; gap: 2px; padding: 4px;
  background: #18181b; color: #e8e8e8; border-radius: 999px;
  box-shadow: 0 12px 32px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06);
  font-size: 12.5px; font-weight: 500; white-space: nowrap;
}
#wc-switch button { border: 0; background: transparent; color: #a3a3a3; padding: 7px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; }
#wc-switch button:hover { color: #e8e8e8; }
#wc-switch button[aria-current="true"] { background: #e8e8e8; color: #18181b; }
#wc-switch button .n { font-variant-numeric: tabular-nums; opacity: .55; font-size: 11px; }
#wc-switch button[aria-current="true"] .n { opacity: .6; }
#wc-switch .sep { width: 1px; height: 16px; background: rgba(255,255,255,.14); margin: 0 4px; }
#wc-switch button.icon { padding: 7px 9px; }
#wc-switch button.icon svg { width: 14px; height: 14px; }
.design { display: none; }
.design.is-active { display: block; }
@media (max-width: 720px) {
  #wc-switch { bottom: 10px; max-width: calc(100vw - 20px); overflow-x: auto; }
  #wc-switch button .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
</style>
</head>
